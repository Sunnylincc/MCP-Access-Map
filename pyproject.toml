[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-access-map"
version = "0.1.0"
description = "Offline MCP configuration inspector and HTML report"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
mcp-access-map = "mcp_access_map:main"

[tool.setuptools]
py-modules = ["mcp_access_map"]
